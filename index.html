<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Result Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Student Result Management System</h1>

    <form id="resultForm" novalidate>
      <label for="studentName">Student Name</label>
      <input type="text" id="studentName" placeholder="Enter student name">

      <label for="subject1">Subject 1 Marks</label>
      <input type="number" id="subject1" min="0" max="100" step="any" placeholder="0-100">

      <label for="subject2">Subject 2 Marks</label>
      <input type="number" id="subject2" min="0" max="100" step="any" placeholder="0-100">

      <label for="subject3">Subject 3 Marks</label>
      <input type="number" id="subject3" min="0" max="100" step="any" placeholder="0-100">

      <p id="errorMessage" class="error" role="alert"></p>

      <div class="buttons">
        <button type="submit">Submit</button>
        <button type="button" id="clearButton" class="clear-button">Clear</button>
      </div>
    </form>

    <table id="resultTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Total</th>
          <th>Percentage</th>
          <th>Grade</th>
          <th>Result</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
  </main>

  <script src="script.js"></script>
</body>
</html>
